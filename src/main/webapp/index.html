<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đặt hàng</title>
<style>
 body{font-family:Arial,sans-serif;background:#f3f5f9;margin:0;padding:24px}
 form{max-width:460px;margin:auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 12px #0001}
 label{display:block;margin:14px 0 4px;font-weight:600;font-size:14px}
 input{width:100%;padding:10px;border:1px solid #ccd;border-radius:8px;box-sizing:border-box;font-size:15px}
 button{margin-top:20px;width:100%;padding:12px;background:#0a58ca;color:#fff;border:0;border-radius:8px;font-size:16px;cursor:pointer}
 small{color:#667}
</style></head><body>
<form method="post" action="checkout">
 <h2>Đặt hàng &amp; thanh toán</h2>
 <label>Họ tên</label><input name="name" required>
 <label>Email nhận xác nhận</label><input name="email" type="email" required>
 <label>Số tiền (VNĐ)</label><input name="amount" type="number" min="1000" value="50000" required>
 <label>Nội dung</label><input name="info" placeholder="Thanh toán đơn hàng">
 <button type="submit">Tiếp tục thanh toán</button>
 <p><small>Thanh toán giả lập, không trừ tiền thật. Email xác nhận được gửi thật.</small></p>
</form></body></html>
