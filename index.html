<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Store</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="index.html">🎵 Music Store</a><a href="cart.html">🛒 Giỏ hàng (<span id="badge">0</span>)</a></header>
<main><h2>Sản phẩm</h2><div class="grid" id="grid">Đang tải...</div></main>
<script src="app.js"></script>
<script>
loadProducts().then(ps => {
  document.getElementById('grid').innerHTML = ps.map(p =>
    `<div class="card"><div class="ico">${p.icon}</div><h3>${p.name}</h3><p class="price">${vnd(p.price)}</p>
     <button onclick="addToCart(${p.id});flash(this)">Thêm vào giỏ</button></div>`).join('');
}).catch(() => document.getElementById('grid').textContent = 'Không tải được sản phẩm.');
</script></body></html>
